name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: mvn -B package
      - name: Validazione domande
        run: java -jar target/ccna-examlab.jar --validate
      - uses: actions/upload-artifact@v4
        with:
          name: ccna-examlab
          path: target/ccna-examlab.jar
