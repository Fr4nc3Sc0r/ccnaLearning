name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build e validazione domande
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lordoc
          path: dist/lordoc.jar
